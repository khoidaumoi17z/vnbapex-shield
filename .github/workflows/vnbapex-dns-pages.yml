name: Publish VNBAPEX DNS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VNBAPEX-DNS-Web.zip
      - VNBAPEX-DNS-Web/**
      - dns-settings.json
      - .github/workflows/vnbapex-dns-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vnbapex-dns-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Unpack source and build DNS profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d VNBAPEX-DNS-Web ]]; then
            task_source="$GITHUB_WORKSPACE/VNBAPEX-DNS-Web"
          else
            unzip -q VNBAPEX-DNS-Web.zip -d package
            task_source="$GITHUB_WORKSPACE/package/VNBAPEX-DNS-Web"
          fi
          task_settings="$task_source/dns-settings.json"
          if [[ -f "$GITHUB_WORKSPACE/dns-settings.json" ]]; then
            task_settings="$GITHUB_WORKSPACE/dns-settings.json"
          fi
          python3 "$task_source/scripts/build.py" --config "$task_settings" --output "$GITHUB_WORKSPACE/_site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

